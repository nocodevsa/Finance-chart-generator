<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candle Studio – Trading Chart Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<style>
:root{--bg:#eceef4;--pn:#fff;--p2:#f2f3f8;--tx:#12151f;--mu:#66708a;--bd:#d6dae6;--ac:#e8890a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080a10;--pn:#121624;--p2:#1a2033;--tx:#eef0f7;--mu:#8a93ad;--bd:#262d44;--ac:#ffb020;--on:#1a1204}}
:root[data-theme="dark"]{--bg:#080a10;--pn:#121624;--p2:#1a2033;--tx:#eef0f7;--mu:#8a93ad;--bd:#262d44;--ac:#ffb020;--on:#1a1204}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Outfit,"Segoe UI",system-ui,Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 22px}
header svg{width:30px;height:30px}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.4px}
header p{margin:0;color:var(--mu)}
.app{display:grid;grid-template-columns:372px minmax(0,1fr);gap:18px;padding:0 22px 22px;max-width:1560px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:0 12px 16px}.stage{order:-1;position:static!important}}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;background:var(--p2)}
.tabs button{border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:10px;font:600 13px Outfit,sans-serif;cursor:pointer}
.tabs button.on{background:var(--pn);color:var(--tx);box-shadow:0 1px 6px #0003}
.pg{display:none;padding:14px 16px 8px;max-height:calc(100vh - 170px);overflow:auto}
.pg.on{display:block}
@media(max-width:900px){.pg{max-height:none}}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.r label{color:var(--mu);flex:0 0 100px}
.nb{width:62px;background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:6px;font:inherit}
.r input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}
.r select{flex:1;min-width:0;background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px;font:inherit}
.r input[type=color]{margin-left:auto;width:46px;height:30px;padding:0;border:2px solid var(--bd);border-radius:9px;background:none;cursor:pointer}
.r.k input{margin-left:auto}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:12px;background:var(--bd);position:relative;cursor:pointer;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=checkbox]:checked{background:var(--ac)}
input[type=checkbox]:checked::after{transform:translateX(17px)}
h3{margin:16px 0 10px;font-size:12.5px;color:var(--mu);font-weight:600;border-top:1px solid var(--bd);padding-top:14px}
h3:first-child{margin-top:0;border:0;padding-top:0}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.looks button{height:46px;border-radius:10px;border:2px solid var(--bd);cursor:pointer;color:#fff;font:700 12px Outfit,sans-serif;text-shadow:0 1px 3px #000a}
.stage{position:sticky;top:12px;align-self:start;min-width:0}
.cv{border:1px solid var(--bd);border-radius:16px;overflow:hidden;line-height:0;background:repeating-conic-gradient(#8885 0 25%,#0000 0 50%) 0 0/22px 22px}
canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bar button{font:600 14px Outfit,sans-serif;cursor:pointer;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:11px;padding:10px 15px}
.bar button.go{background:var(--ac);border-color:var(--ac);color:var(--on);margin-left:auto;padding:10px 22px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.btns button{padding:8px 10px;font:600 13px Outfit,sans-serif;border:1px solid var(--bd);background:var(--p2);color:var(--tx);border-radius:9px;cursor:pointer}.btns.stk button{font-size:21px;padding:3px 8px}
.hint{color:var(--mu);margin:10px 2px 0;font-size:13px}
</style>
</head>
<body>
<header><svg viewBox="0 0 30 30"><rect width="30" height="30" rx="8" fill="#ffb020"/><path d="M9 7v16M15 5v14M21 10v15" stroke="#1a1204" stroke-width="2" stroke-linecap="round"/><rect x="6.5" y="11" width="5" height="7" rx="1.2" fill="#1a1204"/><rect x="12.5" y="8" width="5" height="7" rx="1.2" fill="#fff"/><rect x="18.5" y="14" width="5" height="6" rx="1.2" fill="#1a1204"/></svg>
<div><h1>Candle Studio</h1><p>Chart images for thumbnails. Transparent PNG up to 4K.</p></div></header>
<div class="app">
<div class="panel"><div class="tabs" id="tabs"></div>
<div class="pg" id="p-chart"></div><div class="pg" id="p-look"></div><div class="pg" id="p-lines"></div><div class="pg" id="p-layers"></div><div class="pg" id="p-extra"></div><div class="pg" id="p-export"></div></div>
<div class="stage"><div class="cv"><canvas id="cv"></canvas></div>
<div class="bar"><button id="rnd">Generate new</button><button id="flip">Flip</button><button id="cp">Copy image</button><button id="sv">Download SVG</button><button id="dt">Transparent PNG</button><button class="go" id="dl">Download PNG</button></div>
<p class="hint">Drag elements to move them and press Delete to remove one. With the Custom trend, click or drag empty space to draw your own path.</p></div>
</div>

['chart','h','Pattern'],

['chart','h','Chart style'],
['chart','sel','style','Style','candle',[['candle','Candlesticks'],['hollow','Hollow candles'],['heikin','Heikin-Ashi'],['bars','OHLC bars'],['line','Line'],['area','Area'],['lg','Line graph (multi-line)'],['smooth','Smooth line'],['sarea','Smooth area'],['step','Step line'],['cols','Bar chart (growth bars)'],['fall','Waterfall'],['lolli','Lollipop'],['dots','Dot plot'],['donut','Donut chart'],['pie','Pie chart'],['gauge','Gauge']]],

function row([tab,type,id,label,def,ex]){
 const box=$('p-'+tab);
 if(type==='x'){box.append(XN[id]());return}
 if(type==='h'){const h=document.createElement('h3');h.textContent=id;box.append(h);return}
 if(type==='looks'){const d=document.createElement('div');d.className='looks';
  for(const k in LOOKS){const b=document.createElement('button'),L=LOOKS[k];b.textContent=k;b.style.background=`linear-gradient(135deg,${L.cBg},${L.cBg2||L.cBg} 60%,${L.cUp})`;

 const d=document.createElement('div'),l=document.createElement('label');d.className='r'+(type==='chk'?' k':'');l.textContent=label;l.htmlFor=id;

 e.id=id;els[id]=e;

 set(id,def);
 e.addEventListener('input',()=>{set(id,type==='chk'?e.checked:e.value);if(tab==='lines')set('style','lg');if(tab==='layers')applySel();if(DATA.has(id))build();render()});
 d.append(l,e);if(nbs[id])d.append(nbs[id]);box.append(d)}
function build(){
 const n=S.n,r=rng(seed);
 if(S.trend==='custom'&&closes.length){const old=closes.slice(),m=old.length;closes=Array.from({length:n},(_,i)=>F(i/(n-1),old))}
 else closes=Array.from({length:n},(_,i)=>cl(F(i/(n-1),SH[S.trend])+(r()-.5)*S.vol/100*.28,.04,.96));
 const r3=rng(seed+31);let q1=0,q2=0;dv2=Array.from({length:n},()=>(q1=q1*.85+(r3()-.5)*.5));dv3=Array.from({length:n},()=>(q2=q2*.85+(r3()-.5)*.5));
 const r2=rng(seed+9),v=S.vol/100*.08+.02;

  for(let i=0;i<n;i++){const hc=(o[i]+h[i]+l[i]+c[i])/4,ho=i?(po+pc)/2:po,hh=Math.max(h[i],ho,hc),hl=Math.min(l[i],ho,hc);o[i]=ho;c[i]=hc;h[i]=hh;l[i]=hl;po=ho;pc=hc}}

 const X=i=>x0+slot*(i+.5),Y=v=>y0+(1-v)*(y1-y0),col=i=>S.one?S.cOne:(cc[i]>=o[i]?S.cUp:S.cDn);

  if(S.vig){const g=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${S.vig/100})`);c.fillStyle=g;c.fillRect(0,0,W,H)}}

 let iH=0,iL=0;for(let i=0;i<n;i++){if(h[i]>h[iH])iH=i;if(l[i]<l[iL])iL=i}

  c.globalAlpha=.5;c.fillStyle=S.cUp;c.fillRect(zx,Y(top),x1+slot/2-zx,Y(entry)-Y(top));c.fillStyle=S.cDn;c.fillRect(zx,Y(entry),x1+slot/2-zx,Y(stop)-Y(entry));c.globalAlpha=1}
 if(S.dash){c.strokeStyle=S.cBg<'#555555'&&S.cInk==='#000000'?'#ffffffaa':S.cInk;c.lineWidth=3*s;c.setLineDash([14*s,10*s]);c.beginPath();
  c.moveTo(0,Y(h[iH]));c.lineTo(W,Y(h[iH]));c.moveTo(0,Y(l[iL]));c.lineTo(W,Y(l[iL]));c.stroke();c.setLineDash([])}

 const trace=()=>{c.beginPath();cc.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)))};
 if(NEW.has(S.style))other(c,cc,o,X,Y,s,W,H,y0,y1,slot,bw,col);
 else if(S.style==='line'||S.style==='area'){const k=(S.one?S.cOne:cc[n-1]>=cc[0]?S.cUp:S.cDn);
  if(S.style==='area'){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,k+'99');g.addColorStop(1,k+'00');trace();c.lineTo(X(n-1),y1);c.lineTo(X(0),y1);c.fillStyle=g;c.fill()}
  if(S.ol){trace();c.strokeStyle=S.cInk;c.lineWidth=lw*2.6+8*s;c.stroke()}
  glow(k);trace();c.strokeStyle=k;c.lineWidth=lw*2.6;c.stroke()}

  const fs=Object.values(F).map(f=>`<filter id="${f.id}" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="${f.b/2}" flood-color="${f.col}"/></filter>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${gs}${fs}</defs>${o.join('')}</svg>`}});
 return c}

 const i=Math.floor(((e.clientX-b.left)*k-x0)/((x1-x0)/n));if(i<0||i>=n)return;
